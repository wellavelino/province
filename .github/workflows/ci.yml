name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (gofmt, vet, build, race tests, shellcheck, staticcheck, govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y -q shellcheck
      # Pinned module versions; verify.sh skips these when they are not on PATH.
      # GOTOOLCHAIN=local builds them with the go.mod toolchain from setup-go:
      # otherwise go install switches to the older toolchain their own go.mod
      # names, and staticcheck then cannot load the newer standard library.
      - name: Install staticcheck and govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash .claude/verify.sh

  tofu-validate:
    name: tofu validate (generated configs against the real providers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: tofu version
      - run: bash scripts/tofu-validate.sh

  recipe-container:
    name: recipe in a real Debian 13 container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags integration -run TestRecipeInDebianContainer -v -timeout 20m ./internal/bootstrap/

  incus:
    name: real Incus (plan always; full lifecycle on pushes to main)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - name: Install and start Incus
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q incus
          sudo incus admin init --minimal
          # Let the runner user use the daemon without a new login session.
          sudo chmod 0666 /var/lib/incus/unix.socket
          # Docker on the runner drops forwarded traffic; let incusbr0 through.
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          incus version
          incus list local:
      # The Tailscale secrets reach only this step, and only on pushes to
      # main: elsewhere (pull requests, other branches) they are empty, so
      # the script stops after the plan.
      - run: bash scripts/e2e-incus.sh
        env:
          TS_AUTHKEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TS_AUTHKEY || '' }}
          TS_API_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.TS_API_KEY || '' }}
          TS_TAG: ${{ vars.TS_TAG }}
