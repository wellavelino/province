name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (gofmt, vet, build, race tests, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y -q shellcheck
      - run: bash .claude/verify.sh

  tofu-validate:
    name: tofu validate (generated configs against the real providers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - run: tofu version
      - run: bash scripts/tofu-validate.sh
